<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luciano's Scribe</title>
    <script>
      // Polyfill for process.env to prevent "process is not defined" errors in browser
      if (typeof process === 'undefined') {
        window.process = { env: {} };
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                850: '#1e293b',
                900: '#0f172a',
                950: '#020617',
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .serif-font {
        font-family: 'Merriweather', serif;
      }
      [contenteditable]:empty:before {
        content: attr(data-placeholder);
        color: #94a3b8;
        cursor: text;
      }
      .rich-content img, .rich-editor-content img {
        max-width: 100%;
        height: auto;
        border-radius: 0.5rem;
        margin: 1rem 0;
      }
      .rich-content ul, .rich-editor-content ul {
        list-style-type: disc;
        padding-left: 1.5rem;
        margin: 1rem 0;
      }
      .rich-content ol, .rich-editor-content ol {
        list-style-type: decimal;
        padding-left: 1.5rem;
        margin: 1rem 0;
      }
      .rich-content blockquote {
        border-left: 4px solid #e2e8f0;
        padding-left: 1rem;
        font-style: italic;
        color: #475569;
      }
      /* Dark mode overrides for rich content */
      .dark .rich-content blockquote {
        border-left-color: #475569;
        color: #94a3b8;
      }
      .dark .rich-editor-content {
        background-color: #1e293b;
        color: #e2e8f0;
        border-color: #334155;
      }
      #error-boundary {
        display: none;
        padding: 40px;
        text-align: center;
        color: #ef4444;
        font-family: sans-serif;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "jspdf": "https://aistudiocdn.com/jspdf@^2.5.1",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.45.0"
  }
}
</script>
</head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>
    <div id="error-boundary">
        <h1 class="text-2xl font-bold mb-2">Ops! Ocorreu um erro ao carregar.</h1>
        <p class="text-slate-600">Possível erro de configuração ou chave de API ausente.</p>
        <br>
        <code id="error-details" class="bg-slate-100 p-2 rounded text-xs block mt-2 mx-auto max-w-lg overflow-auto"></code>
    </div>
    <script>
        function showError(msg) {
             const root = document.getElementById('root');
             if (root && root.innerHTML.trim() === '') {
                document.getElementById('error-boundary').style.display = 'block';
                document.getElementById('error-details').innerText = msg;
             }
        }
        window.addEventListener('error', function(event) {
            showError(event.message || 'Erro desconhecido.');
        });
        window.addEventListener('unhandledrejection', function(event) {
            showError('Promise Rejection: ' + (event.reason ? event.reason.message || event.reason : 'Unknown'));
        });
    </script>
  </body>
</html>
