    <script>
      tailwind.config = {

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Merriweather:wght@300;400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      .serif-font {
        font-family: 'Merriweather', serif;
      }
      .font-display {
        font-family: 'Fraunces', serif;
      }
      [contenteditable]:empty:before {
        content: attr(data-placeholder);
        color: #94a3b8;
        cursor: text;
      }
      /* Editor Content Styling */
      .rich-editor-content {
        color: #000000 !important; /* Force black in light mode */
      }
      .dark .rich-editor-content {
        color: #e2e8f0 !important; /* Force light in dark mode */
      }
      
      .rich-content, .rich-editor-content {
          color: #000000;
      }
      
      .rich-content img, .rich-editor-content img {
        max-width: 100%;
        height: auto;
        border-radius: 0.5rem;
        margin: 1rem 0;
      }
      .rich-content ul, .rich-editor-content ul {
        list-style-type: disc;
        padding-left: 1.5rem;
        margin: 1rem 0;
      }
      .rich-content ol, .rich-editor-content ol {
        list-style-type: decimal;
        padding-left: 1.5rem;
        margin: 1rem 0;
      }
      .rich-content blockquote, .rich-editor-content blockquote {
        border-left: 4px solid #e2e8f0;
        padding-left: 1rem;
        font-style: italic;
        color: #475569;
        margin: 1rem 0;
      }
      .rich-content h1, .rich-editor-content h1 { font-size: 2em; font-weight: bold; margin: 0.67em 0; color: #000000; }
      .rich-content h2, .rich-editor-content h2 { font-size: 1.5em; font-weight: bold; margin: 0.83em 0; color: #000000; }
      .rich-content p, .rich-editor-content p { color: #000000; }
      .rich-content li, .rich-editor-content li { color: #000000; }
      
      /* Dark mode overrides for rich content */
      .dark .rich-content blockquote, .dark .rich-editor-content blockquote {
        border-left-color: #475569;
        color: #94a3b8;
      }
      .dark .rich-editor-content {
        background-color: #1e293b;
        border-color: #334155;
      }
      .dark .rich-content p, .dark .rich-editor-content p { color: #e2e8f0; }
      .dark .rich-content h1, .dark .rich-editor-content h1 { color: #ffffff; }
      .dark .rich-content h2, .dark .rich-editor-content h2 { color: #f1f5f9; }
      .dark .rich-content li, .dark .rich-editor-content li { color: #e2e8f0; }

      #error-boundary {
        display: none;
        padding: 40px;
        text-align: center;
        color: #ef4444;
        font-family: sans-serif;
      }
      /* PDF Export helper class */
      .pdf-export-container {
        background-color: white;
        color: black;
        padding: 40px;
        font-family: 'Merriweather', serif;
        width: 800px; /* Fixed width for A4 ratio simulation */
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",

</script>
</head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>
    <div id="error-boundary">
        <h1 class="text-2xl font-bold mb-2">Ops! Ocorreu um erro ao carregar.</h1>
        <p class="text-slate-600">Possível erro de configuração ou chave de API ausente.</p>
        <br>
        <code id="error-details" class="bg-slate-100 p-2 rounded text-xs block mt-2 mx-auto max-w-lg overflow-auto"></code>
    </div>
    <script>
        function showError(msg) {
             const root = document.getElementById('root');
             if (root && root.innerHTML.trim() === '') {
                document.getElementById('error-boundary').style.display = 'block';
                document.getElementById('error-details').innerText = msg;
             }
        }
        window.addEventListener('error', function(event) {
            showError(event.message || 'Erro desconhecido.');
        });
        window.addEventListener('unhandledrejection', function(event) {
            showError('Promise Rejection: ' + (event.reason ? event.reason.message || event.reason : 'Unknown'));
        });
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
